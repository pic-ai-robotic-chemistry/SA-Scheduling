description = "fjspb-drl"
requires-python = ">=3.10"
dependencies = [
    "colorama==0.4.6",
    "flask==3.1.3",
    "gymnasium==1.3.0",
    "h5py==3.16.0",
    "json5==0.14.0",
    "matplotlib==3.10.9",
    "ortools==9.15.6755",
    "pydantic==2.13.4",
    "requests==2.34.0",
    "swanboard>=0.1.10b2",
    "swanlab>=0.7.19",
    "torch==2.9.0",
]

[tool.black]
line-length = 120

[[tool.uv.index]]
url = "https://pypi.mirrors.ustc.edu.cn/simple/"
default = true
